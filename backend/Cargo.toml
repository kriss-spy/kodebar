[package]
name = "kodebar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
zbus = { version = "5.19", features = ["blocking-api"] }

[dev-dependencies]
tempfile = "3"
